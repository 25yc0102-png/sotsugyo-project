<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f4">
  <title>めしガチャ</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="めしガチャ ホーム">めしガチャ</a>
      <div class="header-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="apiStatus">API未接続</span>
      </div>
    </header>

    <main>
      <section class="question-screen" id="questionScreen" aria-labelledby="questionTitle">
        <div class="question-heading">
          <h1 id="questionTitle">ジャンルを選んで</h1>
          <p id="locationStatus" class="location-status" role="status">現在地を確認しています…</p>
        </div>

        <div class="step-progress" aria-label="質問の進行状況">
          <span id="questionStepLabel">STEP 1 / 3 ・ジャンル</span>
          <div class="step-lights" aria-hidden="true">
            <span data-step-light="1" class="is-current"></span>
            <span data-step-light="2"></span>
            <span data-step-light="3"></span>
          </div>
        </div>

        <div class="question-panel">
          <section class="question-step" data-question-step="1" aria-labelledby="genreLegend">
            <fieldset class="choice-group genre-choice">
              <legend id="genreLegend">次のお店は？</legend>
              <div class="genre-options">
                <button class="genre-option genre-featured" type="button" data-genre="izakaya" aria-pressed="true">
                  <span class="option-title">居酒屋</span>
                </button>
                <div class="genre-secondary">
                  <button class="genre-option" type="button" data-genre="ramen" aria-pressed="false">ラーメン</button>
                  <button class="genre-option" type="button" data-genre="cafe" aria-pressed="false">カフェ</button>
                </div>
              </div>
            </fieldset>
          </section>

          <section class="question-step is-hidden" data-question-step="2" aria-labelledby="budgetLegend">
            <fieldset class="choice-group budget-choice">
              <legend id="budgetLegend">予算はどれくらい？</legend>
              <div class="budget-options">
                <button type="button" data-budget="under3000" aria-pressed="true">3000円以下</button>
                <button type="button" data-budget="3001to5000" aria-pressed="false">3001〜5000円</button>
                <button type="button" data-budget="5001to7000" aria-pressed="false">5001〜7000円</button>
                <button type="button" data-budget="any" aria-pressed="false">こだわらない</button>
              </div>
            </fieldset>
          </section>

          <section class="question-step is-hidden" data-question-step="3" aria-labelledby="preferencesTitle">
            <h2 class="step-question-title" id="preferencesTitle">好みを選んで</h2>
            <section class="izakaya-preferences" id="izakayaPreferences" aria-label="居酒屋の希望">
              <fieldset class="choice-group">
                <legend>雰囲気</legend>
                <div class="multi-select-options">
                  <button type="button" data-mood="calm" aria-pressed="false">落ち着いた</button>
                  <button type="button" data-mood="lively" aria-pressed="false">にぎやか</button>
                </div>
              </fieldset>
              <fieldset class="choice-group">
                <legend>料理・店の種類</legend>
                <div class="multi-select-options cuisine-options">
                  <button type="button" data-cuisine="chinese" aria-pressed="false">中華</button>
                  <button type="button" data-cuisine="yakitori" aria-pressed="false">焼き鳥</button>
                  <button type="button" data-cuisine="seafood" aria-pressed="false">海鮮</button>
                  <button type="button" data-cuisine="kushikatsu" aria-pressed="false">串揚げ・串カツ</button>
                  <button type="button" data-cuisine="washoku" aria-pressed="false">和食</button>
                </div>
              </fieldset>
            </section>
            <fieldset class="choice-group range-control">
              <legend>検索する範囲</legend>
              <div class="range-options" role="group" aria-label="検索する範囲">
                <button type="button" data-range="2" aria-pressed="false">500m</button>
                <button type="button" data-range="3" aria-pressed="true">1km</button>
                <button type="button" data-range="4" aria-pressed="false">2km</button>
                <button type="button" data-range="5" aria-pressed="false">3km</button>
              </div>
            </fieldset>
          </section>

          <div class="question-navigation">
            <button class="back-button is-hidden" id="previousQuestionButton" type="button">戻る</button>
            <button class="search-button is-hidden" id="searchButton" type="button" disabled>
              <span>めしガチャを回す</span><span class="button-arrow" aria-hidden="true">↗</span>
            </button>
          </div>

          <form id="manualLocationForm" class="manual-location-form">
            <label for="manualLocationInput">住所・駅名から場所を指定</label>
            <div class="manual-input-row">
              <input id="manualLocationInput" name="location" type="search" autocomplete="off" maxlength="100" placeholder="例：東京駅、新宿区" required>
              <button type="submit" class="manual-search-button" id="manualSearchButton" disabled>この場所を使う</button>
            </div>
            <p class="manual-location-note" id="manualLocationNote">地名検索：<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">© OpenStreetMap contributors</a></p>
            <p class="manual-location-error" id="manualLocationError" role="alert" hidden></p>
          </form>
        </div>
      </section>

      <section class="results-section is-hidden" id="resultsScreen" aria-labelledby="resultsTitle">
        <div class="results-heading">
          <div>
            <h1 id="resultsTitle">運命の3店 <span class="result-count" id="resultCount">--</span></h1>
          </div>
          <div class="results-actions">
            <button class="back-button" id="backToQuestionsButton" type="button">条件を変える</button>
          </div>
        </div>
        <p class="result-context" id="resultContext"></p>
        <div class="slot-machine" id="slotMachine">
          <div class="slot-marquee">
            <div class="slot-lights slot-lights-top" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <div class="slot-marquee-main">
              <div class="slot-marquee-copy">
                <p class="slot-marquee-kicker">二軒目、決定。</p>
                <p class="slot-marquee-title">めしガチャ</p>
              </div>
              <button class="lever-button" id="rerollButton" type="button" disabled aria-label="レバーを引いてもう一度抽選">
                <span class="lever-track" aria-hidden="true"><span class="lever-arm"><span class="lever-knob"></span></span></span>
                <span class="lever-caption">レバーを引く</span>
              </button>
            </div>
            <div class="slot-lights slot-lights-bottom" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          </div>
          <div class="slot-reel-window">
            <div class="slot-reel-labels" aria-hidden="true"><span>1軒目</span><span>2軒目</span><span>3軒目</span></div>
            <div class="result-message" id="resultMessage" aria-live="polite">
              <p>リールが回るのを待っています…</p>
            </div>
            <div class="slot-reels" id="slotReels" aria-live="polite"></div>
          </div>
          <div class="slot-console">
            <p class="slot-status" id="slotStatus" role="status">レバーを引けば運命の3店が決まる</p>
          </div>
        </div>
        <section class="shop-details-section is-hidden" id="shopDetailsSection" aria-labelledby="shopDetailsTitle">
          <h2 id="shopDetailsTitle">当たったお店</h2>
          <div class="shop-grid" id="shopGrid" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <footer class="site-footer">
      <a href="https://webservice.recruit.co.jp/" target="_blank" rel="noreferrer">Powered by ホットペッパーグルメ Webサービス</a>
    </footer>
  </div>
</body>
</html>
