<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163c34">
  <title>まちメシ | 近くのお店を予算から</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #16231f;
      --muted: #64736c;
      --paper: #f1f4ee;
      --surface: #fffefa;
      --line: #dce4dc;
      --forest: #163c34;
      --forest-deep: #102c27;
      --lime: #d8ef78;
      --tomato: #e46147;
      --sky: #d9eaf1;
      --radius: 6px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: repeating-linear-gradient(135deg, transparent 0, transparent 20px, rgba(22, 60, 52, .025) 20px, rgba(22, 60, 52, .025) 21px);
      font-family: "Avenir Next", "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      font-size: 15px;
    }
    button, select, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #e4614770; outline-offset: 2px; }

    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(24px, calc((100vw - 1240px) / 2));
      color: white;
      background: var(--forest-deep);
    }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: inherit; font-size: 20px; font-weight: 850; letter-spacing: 0; text-decoration: none; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: var(--forest-deep); background: var(--lime); font-size: 19px; line-height: 1; }
    .topbar-right { display: flex; align-items: center; gap: 20px; }
    .demo-status { display: inline-flex; align-items: center; gap: 8px; color: #dce8df; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .demo-status::before { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); content: ""; }
    .location-select { min-height: 40px; padding: 0 34px 0 12px; border: 1px solid #ffffff38; border-radius: 4px; color: #fff; background: #ffffff10; cursor: pointer; }
    .location-select option { color: var(--ink); background: white; }

    main { width: min(1240px, calc(100% - 48px)); margin: 0 auto; padding: 40px 0 68px; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 28px; margin-bottom: 28px; animation: rise-in .48s ease-out both; }
    .eyebrow { margin: 0 0 10px; color: var(--tomato); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 34px; line-height: 1.25; letter-spacing: 0; }
    .intro-copy { max-width: 340px; margin: 0 0 3px; color: var(--muted); line-height: 1.8; }

    .workspace { display: grid; grid-template-columns: 312px minmax(0, 1fr); overflow: hidden; min-height: 620px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: 0 18px 42px #172b2010; animation: rise-in .55s .08s ease-out both; }
    .filters { padding: 25px 22px; border-right: 1px solid var(--line); background: #f8faf5; }
    .filter-heading { display: flex; align-items: center; justify-content: space-between; margin: 0 0 25px; }
    .filter-heading h2 { margin: 0; font-size: 15px; }
    .step-count { color: var(--muted); font-size: 11px; font-weight: 700; }
    .step-track { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: -10px 0 23px; }
    .step-track span { height: 3px; border-radius: 2px; background: #dce4dc; }
    .step-track span.active { background: var(--forest); }
    .filter-block { padding: 0 0 23px; margin: 0 0 20px; border-bottom: 1px solid var(--line); }
    .filter-block:last-of-type { border-bottom: 0; }
    .filter-label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; font-size: 13px; font-weight: 750; }
    .filter-number { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .06em; }
    .category-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .category-button { min-height: 40px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 4px; background: white; cursor: pointer; transition: border-color .16s ease, background .16s ease, color .16s ease; }
    .category-button:hover { border-color: #92a69a; }
    .category-button[aria-pressed="true"] { border-color: var(--forest); color: white; background: var(--forest); }
    .budget-value { color: var(--forest); font-size: 14px; font-weight: 800; }
    input[type="range"] { width: 100%; height: 20px; margin: 5px 0 0; accent-color: var(--forest); cursor: pointer; }
    .range-ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
    .area-row { display: flex; align-items: center; gap: 9px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 4px; background: white; }
    .area-pin { color: var(--tomato); font-size: 15px; }
    .area-row select { width: 100%; border: 0; color: var(--ink); background: transparent; font-weight: 700; cursor: pointer; }
    .find-button { width: 100%; min-height: 46px; margin-top: 2px; border: 0; border-radius: 4px; color: var(--forest-deep); background: var(--lime); font-weight: 850; cursor: pointer; transition: transform .16s ease, background .16s ease; }
    .find-button:hover { transform: translateY(-1px); background: #cce85a; }
    .local-note { display: flex; align-items: flex-start; gap: 8px; margin: 15px 0 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .local-note strong { color: var(--forest); }

    .results { min-width: 0; padding: 25px 28px 29px; }
    .results-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 19px; }
    .results-title { margin: 0; font-size: 20px; }
    .results-subtitle { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .sort-control { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 5px; background: #f7f9f4; }
    .sort-button { min-height: 32px; padding: 0 10px; border: 0; border-radius: 3px; color: var(--muted); background: transparent; font-size: 11px; font-weight: 700; cursor: pointer; }
    .sort-button[aria-pressed="true"] { color: white; background: var(--forest); }
    .result-list { display: grid; gap: 10px; }
    .restaurant { display: grid; grid-template-columns: 178px minmax(0, 1fr) auto; align-items: center; gap: 17px; min-height: 132px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); background: white; animation: card-in .35s ease-out both; }
    .restaurant-image { width: 100%; height: 110px; display: block; object-fit: cover; border-radius: 3px; background: var(--sky); }
    .restaurant-content { min-width: 0; align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
    .restaurant-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-bottom: 7px; color: var(--muted); font-size: 10px; }
    .genre { color: var(--forest); font-weight: 800; }
    .dot { width: 3px; height: 3px; border-radius: 50%; background: #9aa9a0; }
    .restaurant-name { overflow: hidden; margin: 0 0 6px; font-size: 17px; text-overflow: ellipsis; white-space: nowrap; }
    .restaurant-desc { overflow: hidden; margin: 0; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .restaurant-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
    .tag { padding: 4px 7px; border-radius: 3px; color: #53665d; background: #edf3eb; font-size: 10px; }
    .restaurant-aside { width: 105px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .price { font-size: 16px; font-weight: 850; white-space: nowrap; }
    .rating { color: #a94e34; font-size: 11px; font-weight: 800; }
    .choose-button { width: 100%; min-height: 34px; border: 1px solid var(--forest); border-radius: 4px; color: var(--forest); background: white; font-size: 11px; font-weight: 800; cursor: pointer; transition: color .16s ease, background .16s ease; }
    .choose-button:hover, .choose-button[aria-pressed="true"] { color: white; background: var(--forest); }
    .empty-state { padding: 52px 20px; border: 1px dashed #b9c8bb; border-radius: 5px; color: var(--muted); text-align: center; }
    .empty-state strong { display: block; margin-bottom: 7px; color: var(--ink); font-size: 15px; }
    .result-foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 15px; color: var(--muted); font-size: 10px; }
    .picked-bar { position: sticky; z-index: 2; bottom: 14px; display: none; width: fit-content; max-width: calc(100% - 28px); align-items: center; gap: 12px; margin: 18px auto 0; padding: 9px 10px 9px 15px; border: 1px solid #375d50; border-radius: 5px; color: white; background: var(--forest-deep); box-shadow: 0 8px 22px #102c2730; font-size: 12px; }
    .picked-bar.visible { display: flex; animation: rise-in .24s ease-out both; }
    .picked-bar button { min-height: 32px; padding: 0 12px; border: 0; border-radius: 3px; color: var(--forest-deep); background: var(--lime); font-size: 11px; font-weight: 850; cursor: pointer; }

    dialog { width: min(440px, calc(100% - 32px)); padding: 0; border: 0; border-radius: 7px; color: var(--ink); box-shadow: 0 24px 80px #101b1770; }
    dialog::backdrop { background: #102c2780; backdrop-filter: blur(3px); }
    .dialog-image { width: 100%; height: 210px; display: block; object-fit: cover; }
    .dialog-body { padding: 20px; }
    .dialog-body h2 { margin: 0 0 7px; font-size: 21px; }
    .dialog-body p { margin: 0 0 16px; color: var(--muted); line-height: 1.7; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .dialog-actions button { min-height: 38px; padding: 0 13px; border: 1px solid var(--line); border-radius: 4px; background: white; font-weight: 750; cursor: pointer; }
    .dialog-actions .confirm { border-color: var(--forest); color: white; background: var(--forest); }
    footer { display: flex; justify-content: space-between; gap: 12px; width: min(1240px, calc(100% - 48px)); margin: 0 auto; padding: 0 0 28px; color: var(--muted); font-size: 10px; }
    @keyframes rise-in { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes card-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 900px) {
      main { width: min(100% - 32px, 720px); padding-top: 29px; }
      .workspace { grid-template-columns: 260px minmax(0, 1fr); }
      .filters { padding: 22px 17px; }
      .results { padding: 22px 17px; }
      .restaurant { grid-template-columns: 130px minmax(0, 1fr); gap: 12px; }
      .restaurant-image { height: 105px; }
      .restaurant-aside { grid-column: 2; width: auto; flex-direction: row; justify-content: space-between; align-items: center; }
      .choose-button { width: auto; padding: 0 10px; }
    }
    @media (max-width: 640px) {
      .topbar { height: 62px; padding: 0 16px; }
      .brand { font-size: 18px; }
      .brand-mark { width: 31px; height: 31px; }
      .topbar-right { gap: 9px; }
      .demo-status { font-size: 9px; letter-spacing: .04em; }
      .location-select { max-width: 132px; min-height: 36px; padding-left: 8px; font-size: 12px; }
      main { width: calc(100% - 28px); padding: 27px 0 45px; }
      .intro { display: block; margin-bottom: 19px; }
      h1 { font-size: 27px; }
      .intro-copy { margin-top: 10px; font-size: 13px; }
      .workspace { grid-template-columns: minmax(0, 1fr); min-height: 0; }
      .filters { padding: 19px 16px 17px; border-right: 0; border-bottom: 1px solid var(--line); }
      .filter-heading { margin-bottom: 19px; }
      .filter-block { display: inline-block; width: calc(50% - 8px); vertical-align: top; margin: 0 12px 14px 0; padding-bottom: 0; border: 0; }
      .filter-block:nth-of-type(3) { margin-right: 0; }
      .category-block { display: block; width: 100%; margin-right: 0; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
      .category-list { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
      .category-button { min-height: 38px; padding: 5px 3px; font-size: 11px; }
      .area-row { padding: 8px; }
      .find-button { min-height: 42px; }
      .local-note { margin-top: 9px; }
      .results { padding: 19px 13px 20px; }
      .results-top { align-items: flex-start; flex-direction: column; gap: 12px; }
      .results-title { font-size: 18px; }
      .sort-control { align-self: stretch; }
      .sort-button { flex: 1; }
      .restaurant { grid-template-columns: 96px minmax(0, 1fr); gap: 10px; padding: 8px; }
      .restaurant-image { height: 92px; }
      .restaurant-name { font-size: 15px; }
      .restaurant-desc { max-width: 100%; font-size: 10px; }
      .restaurant-tags { gap: 4px; margin-top: 6px; }
      .tag { padding: 3px 5px; font-size: 9px; }
      .restaurant-aside { grid-column: 1 / -1; margin-top: 0; }
      .restaurant-meta { gap: 5px; font-size: 9px; }
      .price { font-size: 14px; }
      .result-foot { flex-direction: column; gap: 4px; }
      footer { width: calc(100% - 28px); flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

    [hidden] { display: none !important; }
    .topbar { height: 68px; padding: 0 max(22px, calc((100vw - 1060px) / 2)); }
    .brand { font-size: 21px; }
    .topbar-action { min-height: 38px; padding: 0 13px; border: 1px solid #ffffff75; border-radius: 4px; color: white; background: transparent; font-size: 12px; font-weight: 750; cursor: pointer; }
    .topbar-action:hover { color: var(--forest-deep); background: white; }
    main { width: min(1060px, calc(100% - 40px)); min-height: calc(100vh - 68px); padding: 0 0 42px; }
    .question-view { width: min(760px, 100%); min-height: calc(100vh - 112px); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto; text-align: center; animation: rise-in .35s ease-out both; }
    .question-nav { width: min(600px, 100%); display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .question-count { color: var(--muted); font-size: 12px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .back-button { min-height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); background: var(--surface); font-size: 12px; font-weight: 700; cursor: pointer; }
    .progress-track { width: min(600px, 100%); display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 34px; }
    .progress-track span { height: 3px; border-radius: 3px; background: #d5ded5; }
    .progress-track span.current, .progress-track span.done { background: var(--forest); }
    .question-title { max-width: 100%; margin: 0 0 32px; font-size: 34px; line-height: 1.3; letter-spacing: 0; }
    .question-options { width: min(600px, 100%); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .answer-button { min-height: 66px; padding: 13px 16px; border: 1px solid #d4ded5; border-radius: 5px; color: var(--ink); background: var(--surface); font-size: 16px; font-weight: 750; cursor: pointer; transition: transform .15s ease, border-color .15s ease, background .15s ease, color .15s ease; }
    .answer-button:hover { transform: translateY(-2px); border-color: var(--forest); }
    .answer-button[aria-pressed="true"] { border-color: var(--forest); color: white; background: var(--forest); }
    .question-error { margin: 20px 0 0; color: #a33e2c; font-size: 13px; }
    .result-view { padding: 35px 0 24px; animation: rise-in .35s ease-out both; }
    .result-toolbar { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
    .result-kicker { margin: 0 0 7px; color: var(--tomato); font-size: 10px; font-weight: 800; letter-spacing: .11em; }
    .result-heading { margin: 0; font-size: 27px; }
    .condition-list { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 20px; }
    .condition-chip { padding: 6px 9px; border: 1px solid var(--line); border-radius: 4px; color: #45574f; background: var(--surface); font-size: 11px; }
    .result-message { min-height: 22px; margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    .result-list { display: grid; gap: 11px; }
    .restaurant { grid-template-columns: 188px minmax(0, 1fr) auto; min-height: 144px; gap: 17px; }
    .restaurant-media { position: relative; width: 100%; height: 120px; overflow: hidden; border-radius: 3px; background: #dce9e2; }
    .restaurant-image { width: 100%; height: 100%; object-fit: cover; }
    .photo-credit { position: absolute; right: 0; bottom: 0; left: 0; padding: 4px 5px; color: white; background: #102c27c9; font-size: 9px; line-height: 1.3; }
    .restaurant-address { margin: 5px 0 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .restaurant-aside { width: 122px; }
    .price { white-space: normal; text-align: right; }
    .hotpepper-link { display: inline-flex; min-height: 34px; align-items: center; justify-content: center; padding: 0 9px; border: 1px solid var(--forest); border-radius: 4px; color: var(--forest); font-size: 11px; font-weight: 800; text-align: center; text-decoration: none; }
    .hotpepper-link:hover { color: white; background: var(--forest); }
    .empty-state { padding: 48px 20px; border: 1px dashed #b9c8bb; border-radius: 5px; color: var(--muted); text-align: center; }
    .empty-state strong { display: block; margin-bottom: 6px; color: var(--ink); }
    .api-credit { margin-top: 22px; padding-top: 13px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .api-credit a { color: var(--forest); font-weight: 750; }

    @media (max-width: 640px) {
      .topbar { height: 60px; padding: 0 16px; }
      .brand { font-size: 19px; }
      main { width: calc(100% - 28px); min-height: calc(100vh - 60px); padding-bottom: 24px; }
      .question-view { min-height: calc(100vh - 84px); justify-content: center; }
      .question-nav { margin-bottom: 16px; }
      .progress-track { margin-bottom: 28px; }
      .question-title { margin-bottom: 25px; font-size: 27px; }
      .question-options { grid-template-columns: minmax(0, 1fr); gap: 8px; }
      .answer-button { min-height: 54px; padding: 11px 14px; font-size: 15px; }
      .result-view { padding-top: 25px; }
      .result-toolbar { align-items: start; }
      .result-heading { font-size: 23px; }
      .restaurant { grid-template-columns: 88px minmax(0, 1fr); min-height: 0; gap: 10px; padding: 8px; }
      .restaurant-media { height: 88px; }
      .restaurant-name { font-size: 15px; }
      .restaurant-meta { gap: 5px; font-size: 9px; }
      .restaurant-desc { font-size: 10px; white-space: normal; }
      .restaurant-address { font-size: 9px; }
      .restaurant-aside { grid-column: 1 / -1; width: auto; flex-direction: row; align-items: center; justify-content: space-between; }
      .price { text-align: left; }
      .result-toolbar .topbar-action { flex: 0 0 auto; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="まちメシ">まちメシ</a>
    <button class="topbar-action" id="editConditions" type="button" hidden>条件を変更</button>
  </header>

  <main>
    <section class="question-view" id="questionView" aria-labelledby="questionTitle">
      <div class="question-nav"><button class="back-button" id="backQuestion" type="button" hidden>戻る</button><span class="question-count" id="questionCount"></span></div>
      <div class="progress-track" id="progressTrack" aria-hidden="true"></div>
      <h1 class="question-title" id="questionTitle"></h1>
      <div class="question-options" id="answerOptions"></div>
      <p class="question-error" id="questionError" role="alert" hidden></p>
    </section>

    <section class="result-view" id="resultView" aria-labelledby="resultHeading" hidden>
      <div class="result-toolbar"><div><p class="result-kicker">HOT PEPPER GOURMET</p><h1 class="result-heading" id="resultHeading">お店の候補</h1></div></div>
      <div class="condition-list" id="conditionList"></div>
      <p class="result-message" id="resultMessage" role="status" aria-live="polite"></p>
      <div class="result-list" id="resultList"></div>
      <p class="api-credit">Powered by <a href="https://webservice.recruit.co.jp/" target="_blank" rel="noopener noreferrer">ホットペッパーグルメ Webサービス</a></p>
    </section>
  </main>

  <script src="./hotpepper-config.js"></script>
  <script>
    const endpoint = "https://webservice.recruit.co.jp/hotpepper/gourmet/v1/";
    const questions = [
      { key: "area", title: "どのエリアで探す？", options: [{ label: "高円寺", value: "高円寺" }, { label: "中野", value: "中野" }, { label: "新宿", value: "新宿" }] },
      { key: "genre", title: "どんなジャンルがいい？", options: [{ label: "指定しない", value: "" }, { label: "居酒屋", value: "G001" }, { label: "和食", value: "G004" }, { label: "焼肉", value: "G008" }, { label: "ラーメン", value: "G013" }, { label: "カフェ", value: "G014" }] },
      { key: "budget", title: "予算の目安は？", options: [{ label: "2,000円まで", value: "B001" }, { label: "2,001〜3,000円", value: "B002" }, { label: "3,001〜4,000円", value: "B003" }, { label: "こだわらない", value: "" }] }
    ];
    const state = { step: 0, answers: {} };
    const questionView = document.querySelector("#questionView");
    const resultView = document.querySelector("#resultView");
    const answersElement = document.querySelector("#answerOptions");
    const resultsElement = document.querySelector("#resultList");

    function renderQuestion() {
      const question = questions[state.step];
      questionView.hidden = false;
      resultView.hidden = true;
      document.querySelector("#editConditions").hidden = true;
      document.querySelector("#questionTitle").textContent = question.title;
      document.querySelector("#questionCount").textContent = `${state.step + 1} / ${questions.length}`;
      document.querySelector("#backQuestion").hidden = state.step === 0;
      document.querySelector("#questionError").hidden = true;
      const progress = document.querySelector("#progressTrack");
      progress.replaceChildren(...questions.map((_, index) => {
        const segment = document.createElement("span");
        if (index < state.step) segment.classList.add("done");
        if (index === state.step) segment.classList.add("current");
        return segment;
      }));
      answersElement.replaceChildren(...question.options.map((option) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer-button";
        button.textContent = option.label;
        button.setAttribute("aria-pressed", String(Object.hasOwn(state.answers, question.key) && state.answers[question.key] === option.value));
        button.addEventListener("click", () => {
          state.answers[question.key] = option.value;
          if (state.step === questions.length - 1) {
            searchShops();
          } else {
            state.step += 1;
            renderQuestion();
          }
        });
        return button;
      }));
    }

    function renderConditions() {
      const labels = questions.map((question) => {
        const option = question.options.find((item) => item.value === state.answers[question.key]);
        return option ? option.label : "";
      }).filter(Boolean);
      const chips = document.querySelector("#conditionList");
      chips.replaceChildren(...labels.map((label) => {
        const chip = document.createElement("span");
        chip.className = "condition-chip";
        chip.textContent = label;
        return chip;
      }));
    }

    function addShopCard(shop) {
      const card = document.createElement("article");
      card.className = "restaurant";
      const media = document.createElement("div");
      media.className = "restaurant-media";
      const imageUrl = shop.photo?.pc?.l || shop.photo?.pc?.m || shop.photo?.pc?.s;
      if (imageUrl) {
        const image = document.createElement("img");
        image.className = "restaurant-image";
        image.src = imageUrl;
        image.alt = `${shop.name}の店舗写真`;
        image.loading = "lazy";
        image.addEventListener("error", () => media.remove(), { once: true });
        media.append(image);
        const credit = document.createElement("small");
        credit.className = "photo-credit";
        credit.textContent = "画像提供：ホットペッパー グルメ";
        media.append(credit);
      } else {
        media.setAttribute("aria-hidden", "true");
      }

      const content = document.createElement("div");
      content.className = "restaurant-content";
      const meta = document.createElement("div");
      meta.className = "restaurant-meta";
      meta.textContent = [shop.genre?.name, shop.station_name].filter(Boolean).join(" · ");
      const name = document.createElement("h2");
      name.className = "restaurant-name";
      name.textContent = shop.name || "店名未登録";
      const description = document.createElement("p");
      description.className = "restaurant-desc";
      description.textContent = shop.catch || shop.access || "店舗情報を見る";
      const address = document.createElement("p");
      address.className = "restaurant-address";
      address.textContent = shop.address || "";
      content.append(meta, name, description, address);

      const aside = document.createElement("div");
      aside.className = "restaurant-aside";
      const budget = document.createElement("span");
      budget.className = "price";
      budget.textContent = shop.budget?.average || shop.budget?.name || "予算情報なし";
      aside.append(budget);
      const shopUrl = shop.urls?.pc;
      if (shopUrl) {
        const link = document.createElement("a");
        link.className = "hotpepper-link";
        link.href = shopUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Hot Pepper で見る";
        aside.append(link);
      }
      card.append(media, content, aside);
      resultsElement.append(card);
    }

    async function searchShops() {
      questionView.hidden = true;
      resultView.hidden = false;
      document.querySelector("#editConditions").hidden = false;
      document.querySelector("#resultHeading").textContent = `${state.answers.area}のお店`;
      document.querySelector("#resultMessage").textContent = "店舗を検索しています…";
      resultsElement.replaceChildren();
      renderConditions();
      if (!window.HOTPEPPER_API_KEY) {
        document.querySelector("#resultMessage").textContent = "ローカル設定ファイル hotpepper-config.js が見つかりません。";
        return;
      }
      const params = new URLSearchParams({ key: window.HOTPEPPER_API_KEY, format: "json", keyword: state.answers.area, large_area: "Z011", count: "20", order: "4" });
      if (state.answers.genre) params.set("genre", state.answers.genre);
      if (state.answers.budget) params.set("budget", state.answers.budget);
      try {
        const response = await fetch(`${endpoint}?${params}`);
        const payload = await response.json();
        const results = payload.results;
        if (results?.error) throw new Error(results.error.message || "API エラーが発生しました。");
        const shops = Array.isArray(results?.shop) ? results.shop : results?.shop ? [results.shop] : [];
        document.querySelector("#resultMessage").textContent = shops.length
          ? `${results.results_available || shops.length}件のお店が見つかりました。`
          : "条件に合うお店がありません。条件を変えてお試しください。";
        shops.forEach(addShopCard);
      } catch (error) {
        document.querySelector("#resultMessage").textContent = `検索できませんでした。${error.message || "通信状態を確認してください。"}`;
      }
    }

    document.querySelector("#backQuestion").addEventListener("click", () => {
      if (state.step > 0) state.step -= 1;
      renderQuestion();
    });
    document.querySelector("#editConditions").addEventListener("click", () => {
      state.step = 0;
      renderQuestion();
    });
    renderQuestion();
  </script>
</body>
</html>
